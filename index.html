<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rondgang terras fietsenstalling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#F1F4EF;--panel:#FBFCFA;--fg:#1E2B24;--muted:#4A5C51;--line:#C9D3CB;--btn:#1E2B24;--btnfg:#FBFCFA;--seg:#CBD6CD;--segfill:#1E2B24;--focus:#2B5F86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1511;--panel:#17211B;--fg:#E8EFE9;--muted:#A9B9AE;--line:#2B3A30;--btn:#E8EFE9;--btnfg:#0E1511;--seg:#2E3E34;--segfill:#E8EFE9;--focus:#8CBBDD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1511;--panel:#17211B;--fg:#E8EFE9;--muted:#A9B9AE;--line:#2B3A30;--btn:#E8EFE9;--btnfg:#0E1511;--seg:#2E3E34;--segfill:#E8EFE9;--focus:#8CBBDD;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline;justify-content:space-between}
.eyebrow{margin:0;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(18px,2.2vw,26px);line-height:1.2;font-weight:700;text-wrap:balance}
.sheet{position:relative;background:#FBFCFA;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.plansheet{aspect-ratio:3/1}
.secsheet{aspect-ratio:2/1}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.cam{display:block}
.tag{position:absolute;left:10px;top:8px;z-index:2;font-size:13px;font-weight:600;letter-spacing:.04em;color:#475A4F;background:#FBFCFA;border:1px solid #C9D3CB;border-radius:4px;padding:2px 8px}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#475A4F;font-size:15px;transition:opacity .6s}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.caption{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 24px;min-height:340px}
.kick{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:16px;letter-spacing:0}
.caption h2{margin:6px 0 2px;font-size:clamp(22px,2.4vw,30px);line-height:1.15;font-weight:700;text-wrap:balance}
.meta{margin:0 0 12px;font-size:15px;color:var(--muted)}
.paras p,.intro p{margin:0 0 9px;text-wrap:pretty}
.paras p{opacity:0;animation:up .6s ease forwards;animation-delay:calc(.4s + var(--d)*.8s)}
.paras b{font-weight:700}
.paras p.core{font-size:clamp(18px,1.55vw,21px);line-height:1.4;margin-bottom:12px}
.pill{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--btn);color:var(--btnfg);font-weight:600;font-size:15px}
.hint{margin-top:14px;font-size:14px;color:var(--muted)}
.qs{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:7px}
.qs li{display:flex;gap:10px;font-size:14.5px;line-height:1.35;opacity:.45;transition:opacity .4s}
.qs li.on{opacity:1}.qs li.done{opacity:.7}
.qs i{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--fg);border-radius:3px;display:inline-flex;align-items:center;justify-content:center}
.qs li.on i{background:var(--fg)}
.fade{animation:fin .5s ease both}
.controls{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.b{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.b.main{background:var(--btn);color:var(--btnfg);border-color:var(--btn);min-width:132px}
.b:focus-visible,.seg:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.b svg{width:18px;height:18px;flex:none}
.prog{flex:1 1 420px;min-width:0;display:flex;gap:4px;align-items:flex-end}
.seg{position:relative;flex:1 1 0;min-width:0;height:44px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;color:var(--muted);font-size:12px;line-height:1.1;text-align:center}
.seg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.seg em{display:block;height:6px;border-radius:3px;background:var(--seg);overflow:hidden}
.seg em i{display:block;height:100%;width:0;background:var(--segfill)}
.seg.cur{color:var(--fg);font-weight:600}
.seg:hover em{background:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-32}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
[data-key]{transition:opacity .7s ease;transform-box:fill-box;transform-origin:50% 50%}
.lamps circle[stroke-dasharray]{animation:glow calc(var(--beat,.63s)*3) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flowing [data-key="flow"] line,.flowing [data-key="flow"] path:not([fill]){stroke-dasharray:9 7;animation:dash var(--beat,.63s) linear infinite}
.drifting .bak .bakin{animation:drift calc(var(--beat,.63s)*5) ease-in-out infinite alternate;animation-delay:calc(var(--i)*var(--beat,.63s)*-1)}
.pulse{animation:pulse calc(var(--beat,.63s)*2) ease-in-out infinite}
@media (max-width:900px){
 .row{grid-template-columns:minmax(0,1fr)}
 .plansheet{aspect-ratio:4/3}.secsheet{aspect-ratio:4/3}
 .caption{min-height:0}
 .seg span{display:none}.seg{height:26px}
 #sndLb,#voLb{display:none}
 .b.main{min-width:120px}
}
/* startscherm */
.pretitle{display:none}
.pre .controls{position:fixed;inset:0;z-index:30;flex-direction:column;justify-content:center;align-items:center;flex-wrap:nowrap;gap:28px;background:var(--bg);border:0;padding:24px}
.pre .pretitle{display:block;text-align:center;max-width:34ch}
.pretitle h2{margin:6px 0 0;font-size:clamp(26px,4.4vw,42px);line-height:1.15;font-weight:700;text-wrap:balance}
.pre .btns{display:grid;grid-template-columns:auto auto;gap:14px;justify-items:center}
.pre #play{grid-column:1/-1;min-height:68px;min-width:220px;padding:0 48px;font-size:22px;gap:12px}
.pre #play svg{width:24px;height:24px}
.pre #prev,.pre #next,.pre #prog{display:none}
.pre #sndLb,.pre #voLb{display:inline}
:root:has(.pre){overflow:hidden}
@media (max-width:480px){.btns{gap:6px}.b{padding:0 10px}.b.main{min-width:100px}}
@media (max-width:350px){.btns{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){
 .paras p{animation:none;opacity:1}.lamps circle[stroke-dasharray],.flowing [data-key="flow"] line,.flowing [data-key="flow"] path,.drifting .bak .bakin,.pulse{animation:none}
 [data-key]{transition:none}
}
</style>
<style>html,body{margin:0}</style>
</head>
